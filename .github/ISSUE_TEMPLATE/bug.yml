name: Bug report
description: Report a reproducible problem in the website, tooling or validator.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include client, matter, personal or security-sensitive information. Use private vulnerability reporting for security issues."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide minimal synthetic steps or data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public-data boundary
      options:
        - label: I confirm this report contains no protected or unauthorized material.
          required: true
